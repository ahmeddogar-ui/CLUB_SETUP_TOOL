<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ClubRegistry{% endblock %}</title>
  <style>
    :root {
      --bg: #f4f5f7; --surface: #fff; --text: #1f2430; --muted: #6b7280; --border: #e3e6eb;
      --accent: #4338ca; --accent-hover: #3730a3; --accent-soft: #eef0ff;
      --danger: #b42318; --danger-soft: #fdecea; --ok: #1e7e34; --ok-soft: #e7f6ec;
      --warn-soft: #fff6e0; --warn: #8a5a00;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); }
    .topbar-inner { max-width: 960px; margin: 0 auto; padding: 0.75rem 1.25rem;
                    display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .brand { font-weight: 700; font-size: 1.1rem; color: var(--text); letter-spacing: -0.01em; }
    .brand::before { content: ""; display: inline-block; width: 0.8rem; height: 0.8rem; margin-right: 0.5rem;
                     border-radius: 3px; background: var(--accent); }
    .brand:hover { text-decoration: none; }
    .nav-right { display: flex; align-items: center; gap: 0.75rem; font-size: 0.95rem; }
    .nav-right form { margin: 0; }
    .who { color: var(--muted); }
    .who strong { color: var(--text); font-weight: 600; }

    main { max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    h1 { font-size: 1.6rem; margin: 0 0 1rem; letter-spacing: -0.015em; }
    h2 { font-size: 1.1rem; margin: 0 0 0.75rem; }
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
    .page-head h1 { margin: 0; }
    .muted { color: var(--muted); }
    .lead { color: var(--muted); margin: -0.5rem 0 1.5rem; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; box-shadow: 0 1px 2px rgba(16,24,40,0.04); }
    .card.narrow { max-width: 420px; margin-left: auto; margin-right: auto; }
    .card.flush { padding: 0; overflow: hidden; }
    .card-title { padding: 1rem 1.5rem 0; }
    .empty { text-align: center; padding: 2.5rem 1rem; color: var(--muted); }

    .error, .success, .warning { padding: 0.75rem 1rem; border-radius: 8px; margin: 0 0 1rem; font-size: 0.95rem; }
    .error { color: var(--danger); background: var(--danger-soft); border: 1px solid #f5c6c1; }
    .success { color: var(--ok); background: var(--ok-soft); border: 1px solid #bfe3ca; }
    .warning { color: var(--warn); background: var(--warn-soft); border: 1px solid #f1deae; }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em;
         color: var(--muted); font-weight: 600; padding: 0.7rem 1rem; background: #fafbfc;
         border-bottom: 1px solid var(--border); }
    td { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    td small { color: var(--muted); }
    .nowrap { white-space: nowrap; }

    .status { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.78rem;
              font-weight: 600; background: #eceef2; color: #4b5563; white-space: nowrap; }
    .status-submitted { background: #e0ecff; color: #1d4ed8; }
    .status-under_review { background: #fff1d6; color: #9a6200; }
    .status-changes_requested { background: #ffe8d6; color: #b4470b; }
    .status-approved { background: #dcf5e4; color: #176b34; }
    .status-rejected { background: #fde2e0; color: #a3261c; }

    label { display: block; margin: 1rem 0 0.3rem; font-weight: 600; font-size: 0.9rem; }
    input, textarea { width: 100%; padding: 0.6rem 0.75rem; font: inherit; color: inherit; background: #fff;
                      border: 1px solid #cfd4dc; border-radius: 8px; }
    input:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    form.stack button { margin-top: 1.25rem; width: 100%; }

    .btn, button { display: inline-block; padding: 0.55rem 1rem; font: inherit; font-weight: 600; font-size: 0.92rem;
                   color: var(--text); background: #fff; border: 1px solid #cfd4dc; border-radius: 8px; cursor: pointer; }
    .btn:hover, button:hover { background: #f3f4f6; text-decoration: none; }
    .btn-primary, button.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
    .btn-primary:hover, button.primary:hover { background: var(--accent-hover); }
    button.danger { color: var(--danger); border-color: #f0bdb8; }
    button.danger:hover { background: var(--danger-soft); }
    button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 0.35rem 0.6rem; }
    button.ghost:hover { background: #eceef2; color: var(--text); }
    button.small { padding: 0.35rem 0.7rem; font-size: 0.85rem; }

    .inline-form { display: flex; gap: 0.5rem; align-items: center; margin: 0; }
    .inline-form input { min-width: 0; padding: 0.4rem 0.6rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .doc-link { overflow-wrap: anywhere; font-size: 0.9rem; }
    .auth-switch { text-align: center; color: var(--muted); margin-top: 1rem; font-size: 0.92rem; }

    @media (max-width: 640px) {
      .topbar-inner { flex-wrap: wrap; }
      .page-head { flex-direction: column; align-items: flex-start; }
      .card.flush { overflow-x: auto; }
      td, th { padding: 0.6rem 0.7rem; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/dashboard">ClubRegistry</a>
      <div class="nav-right">
        {% if current_user %}
          <span class="who"><strong>{{ current_user.name }}</strong> &middot; {{ current_user.role.value.replace("_", " ") }}</span>
          <form method="post" action="/logout">
            <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
            <button type="submit" class="ghost">Log out</button>
          </form>
        {% else %}
          <a href="/login">Log in</a>
          <a class="btn btn-primary" href="/register">Register</a>
        {% endif %}
      </div>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
