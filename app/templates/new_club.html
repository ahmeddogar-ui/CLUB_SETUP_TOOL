{% extends "base.html" %}

{% block title %}New club{% endblock %}

{% block content %}
  <div class="card narrow">
    <h1>New club</h1>
    <p class="muted">Start a registration. You can add documents before submitting it for review.</p>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="/club/new" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <label for="name">Club name</label>
      <input type="text" id="name" name="name" value="{{ name or '' }}" required>

      <label for="description">Description</label>
      <textarea id="description" name="description" rows="4" required>{{ description or '' }}</textarea>

      <button type="submit" class="primary">Create club</button>
    </form>
  </div>
{% endblock %}
