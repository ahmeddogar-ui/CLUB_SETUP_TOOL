[project]
name = "club-setup-tool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ahmeddogar-ui", email = "azrael.dogar@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "itsdangerous>=2.2.0",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
club-setup-tool = "club_setup_tool:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length is left to the author
    "B008",  # FastAPI's Depends()/Query() defaults are the framework's idiom
    "B904",  # HTTPException raised from except blocks is intentional here
    "UP040", # `type X = ...` is a TypeAliasType, which FastAPI does not unwrap for Annotated deps
    "UP042", # StrEnum would change str() of the role/status enums
]

[tool.mypy]
plugins = ["pydantic.mypy"]
files = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
